{% set name = "scriptengine" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/scriptengine-{{ version }}.tar.gz
  sha256: f2e68a5d7e4712a5ffd45d6b2cda942369168a77d5de8d13922e9643f08a0857

build:
  entry_points:
    - se = scriptengine.cli.se:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=60
  run:
    - python >={{ python_min }}
    - python-dateutil
    - pyyaml
    - jinja2 >=3.0.0
    - deepmerge

test:
  imports:
    - scriptengine
  commands:
    - pip check
    - se --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/uwefladrich/scriptengine
  summary: A lightweight and extensible framework for executing scripts written in YAML
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - uwefladrich
